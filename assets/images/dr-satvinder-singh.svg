<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGradSat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FC"/>
      <stop offset="100%" stop-color="#D5EEFA"/>
    </linearGradient>
    <linearGradient id="ringGradSat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073B63"/>
      <stop offset="100%" stop-color="#18B6C9"/>
    </linearGradient>
    <filter id="shadowSat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#073B63" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Circle -->
  <circle cx="120" cy="120" r="105" fill="url(#bgGradSat)" stroke="url(#ringGradSat)" stroke-width="3" filter="url(#shadowSat)"/>
  
  <!-- Inner Decorative Dashed Ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#073B63" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Doctor Silhouette / Medical Professional Iconography -->
  <g transform="translate(120, 115)">
    <!-- Stethoscope Around Neck -->
    <path d="M-36 28 C-36 50 -18 64 0 64 C18 64 36 50 36 28 L36 10 C36 2 30 -4 22 -4 C16 -4 14 0 14 6 L14 26 C14 36 6 44 0 44 C-6 44 -14 36 -14 26 L-14 6 C-14 0 -16 -4 -22 -4 C-30 -4 -36 2 -36 10 Z" fill="#0B6EBD" opacity="0.3"/>
    
    <!-- Doctor Coat / Torso -->
    <path d="M-55 70 C-55 42 -35 25 0 25 C35 25 55 42 55 70 Z" fill="#073B63"/>
    <!-- Coat Lapels / Tie -->
    <path d="M-15 25 L0 55 L15 25 Z" fill="#FFFFFF"/>
    <path d="M-5 35 L0 60 L5 35 Z" fill="#0B6EBD"/>

    <!-- Head & Neck -->
    <circle cx="0" cy="-14" r="28" fill="#0B6EBD"/>
    <!-- Cross healing insignia -->
    <circle cx="0" cy="-28" r="7" fill="#18B6C9"/>
    <rect x="-1" y="-32" width="2" height="8" fill="#FFFFFF"/>
    <rect x="-4" y="-29" width="8" height="2" fill="#FFFFFF"/>
  </g>

  <!-- Initials Badge SatS -->
  <g transform="translate(120, 192)">
    <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#0B6EBD" filter="url(#shadowSat)"/>
    <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DR. SAT. S</text>
  </g>
</svg>
