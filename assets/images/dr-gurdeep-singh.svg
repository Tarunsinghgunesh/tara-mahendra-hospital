<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGradGS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FC"/>
      <stop offset="100%" stop-color="#D5EEFA"/>
    </linearGradient>
    <linearGradient id="ringGradGS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6EBD"/>
      <stop offset="100%" stop-color="#18B6C9"/>
    </linearGradient>
    <filter id="shadowGS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#073B63" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Circle -->
  <circle cx="120" cy="120" r="105" fill="url(#bgGradGS)" stroke="url(#ringGradGS)" stroke-width="3" filter="url(#shadowGS)"/>
  
  <!-- Inner Decorative Dashed Ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#0B6EBD" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Doctor Silhouette / Medical Professional Iconography -->
  <g transform="translate(120, 115)">
    <!-- Stethoscope Around Neck -->
    <path d="M-36 28 C-36 50 -18 64 0 64 C18 64 36 50 36 28 L36 10 C36 2 30 -4 22 -4 C16 -4 14 0 14 6 L14 26 C14 36 6 44 0 44 C-6 44 -14 36 -14 26 L-14 6 C-14 0 -16 -4 -22 -4 C-30 -4 -36 2 -36 10 Z" fill="#0B6EBD" opacity="0.3"/>
    
    <!-- Doctor Coat / Torso -->
    <path d="M-55 70 C-55 42 -35 25 0 25 C35 25 55 42 55 70 Z" fill="#073B63"/>
    <!-- Coat Lapels / Tie -->
    <path d="M-15 25 L0 55 L15 25 Z" fill="#FFFFFF"/>
    <path d="M-5 35 L0 60 L5 35 Z" fill="#0B6EBD"/>

    <!-- Head & Neck -->
    <circle cx="0" cy="-14" r="28" fill="#0B6EBD"/>
    <!-- Medical Head Mirror / Headband Symbol -->
    <rect x="-24" y="-30" width="48" height="6" rx="3" fill="#18B6C9"/>
    <circle cx="0" cy="-27" r="7" fill="#FFFFFF"/>
    <circle cx="0" cy="-27" r="3.5" fill="#073B63"/>
  </g>

  <!-- Initials Badge GS -->
  <g transform="translate(120, 192)">
    <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#0B6EBD" filter="url(#shadowGS)"/>
    <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DR. GS</text>
  </g>
</svg>
